[workspace]
resolver = "3"
members = ["native/angr", "native/angr-macros"]

[workspace.package]
description = "angr's native Rust symbolic-execution engine (VEX interpreter, Z3 bridge, PyO3 exploration manager)"
license = "BSD-2-Clause"
readme = "README.md"
keywords = [
    "analysis",
    "angr",
    "binary",
    "decompiler",
    "emulator",
    "engineering",
    "execution",
    "research",
    "reverse",
    "security",
    "symbolic",
    "vulnerability",
]
categories = ["science", "security"]
repository = "https://github.com/angr/angr.git"

[workspace.lints.clippy]
all = "warn"
cargo = "warn"
# Panics on caller-supplied/untrusted input are a recurring audit-bug class
# (angr-9ke6b .126/.191/.63/.75). New code and files without a grandfather
# #![allow(...)] must handle the None/Err case explicitly instead of
# unwrap()/expect(). See angr-9ke6b follow-up bead for burning down the
# existing grandfathered sites.
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# CI-test-only profile: same as `release` but with overflow-checks on, so
# integer overflow panics loudly in `cargo test` instead of silently
# wrapping (angr-9ke6b audit found overflow-adjacent bugs -- e.g.
# SegmentList::release's missing overflow guard, NativeMemmove's
# non-wrapping overlap-check addition -- that a checked build would catch
# immediately in any test that exercises the path). NOT used for production
# wheels or `bench-regression`, which both still build against plain
# `release` -- overflow-checks adds real per-op runtime cost we don't want
# to ship or benchmark against. Also drops `release`'s fat LTO /
# single-codegen-unit settings (same rationale as `release-fast` below):
# overflow-checks doesn't need link-time optimization, and a from-scratch
# fat-LTO build of this crate OOM-killed rustc on a 7.8G/0-swap box the
# first time this profile was built.
[profile.release-checked]
inherits = "release"
overflow-checks = true
lto = "off"
codegen-units = 16

# Inner-loop dev profile: ~3x faster warm rebuild than `release` by trading
# LTO + single-codegen-unit link time for parallelism. Runtime impact on
# fast-tier benches (fauxware, defcamp_r100, csaw_wyvern) was within 5-sample
# noise — see bd memory `build-perf-spike-codegen-units` (angr-6w5l).
# Use via `tools/rebuild-rust.sh --fast`. NOT for benchmark gates or release
# artifacts — bench-regression and CI continue to use `release`.
[profile.release-fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true

[patch.crates-io]
z3 = { path = "native/z3-patched" }
