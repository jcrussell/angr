# .ralph/config.toml — rust-symex optimization loop config.
#
# Built-in defaults from internal/config.Defaults() are: max_iterations=30,
# session_timeout=3600s, memory_limit=7G, dirty_revert_threshold=3, gate
# timeout=600s, soft_fail=true, run_when="commits-only". We override only
# what's different.

[loop]
# Cap the per-iteration systemd scope so it plus the service's MemoryMax
# (tools/ralph-angr.service, which holds the gate) fits in the box's 7.8G RAM
# with no swap. The default 7G == whole machine, so a runaway (e.g. a divergent
# exploration) was OOM-killed only after exhausting RAM, which kills the whole
# `claude` session (0-byte output -> dead_session -> runner_terminal); a leaking
# CADET explore did exactly that (angr-027h). tools/ralph-claude.sh caps the
# agent's own cargo builds at CARGO_BUILD_JOBS=2 to stay under it. NOTE:
# pytest/repro run in the SAME scope as claude, so an OOM still ends the
# session — this is a backstop, not isolation. Heavy/unbounded explores must
# self-cap (see MEMORY SAFETY in _footer.md).
memory_limit_bytes = "4G"
# A dead-session streak (runner_terminal) cools down and retries instead of
# ending the run; a healthy session resets the count. Replaces the retry loop
# the old tools/ralph-supervise.sh wrapper ran around `ralph run --fresh`.
runner_terminal_retries = 6
runner_terminal_cooldown_secs = 900

[gate]
# The gate is tools/ralph-gate.sh (shared by the clean/ and dirty/ state hooks);
# its header lists the checks it runs and what each costs. 1200s keeps a
# slow/loaded box from tripping a timeout even on a cold from-scratch
# target/release-checked/ build. All other [gate] knobs keep their built-in
# defaults: soft_fail=true, run_when="commits-only".
timeout_secs = 1200

[runner]
# Wrapper script that exports PATH for ~/.cargo/bin and sources .venv before
# exec-ing claude. Without this, ralph would need to be invoked from an already
# activated venv every time.
command = "tools/ralph-claude.sh"
args    = []
model   = "opus"

[review]
# angr defaults to `master`, not `main`.
base_branch = "master"
