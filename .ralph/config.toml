# .ralph/config.toml — rust-symex optimization loop config.
#
# Built-in defaults from internal/config.Defaults() are: max_iterations=30,
# session_timeout=3600s, memory_limit=7G, dirty_revert_threshold=3, gate
# timeout=600s, soft_fail=true, run_when="commits-only". We override only
# what's different.

[loop]
# Cap the per-iteration systemd scope BELOW the box's total RAM (7G, no swap).
# Default is 7G == whole machine, so any >7G process (e.g. a divergent
# exploration) gets OOM-killed only after exhausting RAM, which kills the whole
# `claude` session (0-byte output -> dead_session -> runner_terminal). This is
# what failed run 20260613 iters 28-30 (a CADET explore leaked states; see bd
# angr-027h / memory deferred-forks-unconstrained-oom). 6G leaves ~1G headroom
# so a runaway is killed sooner. NOTE: pytest/repro run in the SAME scope as
# claude, so an OOM still ends the session — this is a backstop, not isolation.
# Heavy/unbounded explores must self-cap (see MEMORY SAFETY in _footer.md).
memory_limit_bytes = "6G"

[gate]
# The gate (tools/ralph-gate.sh, shared by the clean/ and dirty/ state hooks) now
# runs `cargo test --release` ahead of the fast-tier benchmark regression.
# Measured on a warm tree: 14s cargo test + 32s bench = 46s wall. An iteration
# that touched native/ must rebuild the Rust test binaries first, which costs
# ~2m — note that `cargo clippy --all-targets` does NOT warm them, since clippy's
# driver keeps separate fingerprints from rustc's — so the realistic worst case
# is ~3m. That still fits the 600s default, but the margin is thinner than it
# was; 1200s keeps a slow/loaded box from tripping a timeout on what is really a
# passing gate. All other [gate] knobs keep their built-in defaults:
# soft_fail=true, run_when="commits-only".
timeout_secs = 1200

[runner]
# Wrapper script that exports PATH for ~/.cargo/bin and sources .venv before
# exec-ing claude. Without this, ralph would need to be invoked from an already
# activated venv every time.
command = "tools/ralph-claude.sh"
args    = []
model   = "opus"

[review]
# angr defaults to `master`, not `main`.
base_branch = "master"
