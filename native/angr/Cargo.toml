[package]
name = "angr"
version = "0.1.0"
edition = "2024"
description.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
name = "rustylib"
crate-type = ["cdylib", "rlib"]

[features]
# VEX engine with Z3 enabled by default; fuzzer is optional
default = ["vex-engine", "vex-engine-z3", "automaton"]
vex-engine = ["im", "lru"]
vex-engine-z3 = ["vex-engine", "z3", "z3-sys", "crossbeam-deque"]
fuzzer = ["icicle-fuzzing", "icicle-vm", "libafl", "libafl_bolts", "pcode"]
# Dev-only: widen the pure hostile-input parsers (format-string width/length,
# Z3 numeral-string decoders) to a crate-`pub` surface so the cargo-fuzz targets
# under `fuzz/` can reach them. NOT in `default`; adds no runtime code to a
# stock build. See fuzz/README.md (angr-qwyti.9).
fuzzing = []
automaton = ["indexmap", "fixedbitset"]
# Default-ON since 807bfd74d (human GO 2026-07-15, bd angr-3trr7): native
# cold-block lifting via direct libVEX FFI against the venv's
# pyvex/lib/libpyvex.so (bd angr-3s5js / angr-z087y Stage-1). Not in the
# `default` set above because setup.py appends it -- a stock
# `pip install -e .` builds WITH it, and the bench-regression baselines
# (baseline_timings.json / baseline_counters.json) were refreshed on that
# native-lift build, rpath and all. Opt OUT with
# `ANGR_LIBVEX_FFI=0 pip install -e .`. See
# docs/advanced-topics/rust_libvex_ffi.rst.
libvex-ffi = ["dep:bindgen"]

[dependencies]
backtrace = "0.3.76"
parking_lot = "0.12"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
pyo3 = { version = "0.27.2", features = ["py-clone", "abi3-py310"] }
rangemap = "1.7.1"
rustc-hash = "2.1"
send_wrapper = "0.6.0"
smallvec = "1.15"
# Automaton module dependencies (optional, needs network to resolve)
indexmap = { version = "2.13", optional = true }
fixedbitset = { version = "0.5", optional = true }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
log = "0.4"
# env_logger gives us `Filter` (RUST_LOG-style per-module log filters).
# We only use the `filter` module — no formatter / atty / color / humantime.
env_logger = { version = "0.8", default-features = false }
target-lexicon = "0.12.16"

# VEX Engine dependencies (optional, enabled by default)
z3 = { version = "0.19", optional = true }
# Direct z3-sys dep so we can call Z3 FP-theory FFI functions that are not
# exposed via z3-rs high-level API (sqrt, fma, to_fp_bv).
z3-sys = { version = "0.10", optional = true }
im = { version = "15.1", optional = true }
lru = { version = "0.12", optional = true }
# Unconditional: subsystem error enums (e.g. ConstraintSyncError in
# symbolic/context.rs) derive thiserror::Error even in the no-default-features
# mock build, so it cannot be gated behind vex-engine (angr-ph300.79).
thiserror = "1.0"
# Work-stealing deque for the parallel exploration scheduler (angr-1ilq.3).
# Gated under vex-engine-z3 (the scheduler only exists alongside the Z3-backed
# StateMigrationPayload transport). Already present in Cargo.lock transitively
# (via rayon), so promoting it to a direct dep adds zero new crates.
crossbeam-deque = { version = "0.8", optional = true }

# Fuzzer dependencies (optional)
icicle-fuzzing = { git = "https://github.com/icicle-emu/icicle-emu.git", rev = "4d7ed93254a20b7e5c16bd7b0c6b46db49e1c72e", optional = true }
icicle-vm = { git = "https://github.com/icicle-emu/icicle-emu.git", rev = "4d7ed93254a20b7e5c16bd7b0c6b46db49e1c72e", optional = true }
libafl = { version = "=0.15.3", optional = true }
libafl_bolts = { version = "=0.15.3", optional = true }
pcode = { git = "https://github.com/icicle-emu/icicle-emu.git", rev = "4d7ed93254a20b7e5c16bd7b0c6b46db49e1c72e", optional = true }

# Optional build-dep: only pulled in by the `libvex-ffi` feature (default-ON
# via setup.py; see the [features] comment above).
# Pinned to the same major bindgen z3-sys already resolves in Cargo.lock so no
# new registry fetch is needed. Generates the pyvex FFI decls from the vendored
# cdef header (vendor/pyvex_ffi.h) at build time — see build.rs.
[build-dependencies]
bindgen = { version = "0.72", optional = true }

[dev-dependencies]
tempfile = "3.24.0"
quickcheck = "1.0"
quickcheck_macros = "1.0"
criterion = "0.5"

[[bench]]
name = "vex_engine"
harness = false

# Examples gated behind engine features (bd angr-cagbn): both pull in
# feature-gated modules (`vex`, `memory`, `state`, z3 solver), so the no-z3
# nightly `cargo test` combos would fail to compile them without a
# required-features guard. cargo only builds an example when its required
# features are active.
[[example]]
name = "leak_probe"
required-features = ["vex-engine-z3"]

[[example]]
name = "bench_deserialize"
required-features = ["vex-engine"]
