[package]
name = "angr"
version = "0.1.0"
edition = "2024"
description.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints.clippy]
# Group entries need a lower priority than the individual lints below so the
# specific settings win; cargo errors out when they tie.
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Panics on caller-supplied/untrusted input are a recurring audit-bug class
# (angr-9ke6b .126/.191/.63/.75). New code and files without a grandfather
# #![allow(...)] must handle the None/Err case explicitly instead of
# unwrap()/expect(). See angr-9ke6b follow-up bead for burning down the
# existing grandfathered sites.
unwrap_used = "warn"
expect_used = "warn"
# `Result`/`Option` are already `#[must_use]`, but every silently-discarded-error
# finding across all three audit rounds (angr-sqfj8 .87/.82/.38, angr-c7xno
# .60/.84, plus round 1's dead-code cluster) opted OUT of that via
# `let _ = <fallible expr>;` — so plain must_use never caught them. This lint
# flags exactly that shape. A discard that really is expected control flow
# stays legal by spelling itself `drop(expr)` with a `SILENT(cat-a)` rationale
# comment; a lossy one uses `silent_default!` (see its doc in
# native/angr/src/lib.rs). When the
# discarded value is `Copy` (e.g. `compare_exchange`'s `Result<u64, u64>`),
# `drop` is a no-op that clippy rejects in turn — those keep `let _ =` under an
# `#[expect(clippy::let_underscore_must_use, reason = "SILENT(cat-a): ...")]`.
let_underscore_must_use = "deny"

[lib]
name = "rustylib"
crate-type = ["cdylib", "rlib"]

[features]
# VEX engine with Z3 enabled by default. `fuzzer` and `automaton` are
# always built (their deps are unconditional, as upstream); the features stay
# as empty names so existing `#[cfg(feature = ...)]` gates keep resolving.
default = ["vex-engine", "vex-engine-z3", "automaton"]
vex-engine = ["im", "lru"]
vex-engine-z3 = ["vex-engine", "z3", "z3-sys", "crossbeam-deque"]
fuzzer = []
# Dev-only: widen the pure hostile-input parsers (format-string width/length,
# Z3 numeral-string decoders) to a crate-`pub` surface so the cargo-fuzz targets
# under `fuzz/` can reach them. NOT in `default`; adds no runtime code to a
# stock build. See fuzz/README.md (angr-qwyti.9).
fuzzing = []
automaton = []

[dependencies]
angr-macros = { path = "../angr-macros" }
backtrace = "0.3.76"
clarirs-core = { path = "../clarirs-core", features = ["runtime-checks"] }
clarirs-num = { path = "../clarirs-num" }
clarirs-vsa = { path = "../clarirs-vsa" }
clarirs-z3 = { path = "../clarirs-z3" }
dashmap = "6.2.1"
log = "0.4.32"
# env_logger gives us `Filter` (RUST_LOG-style per-module log filters).
# We only use the `filter` module — no formatter / atty / color / humantime.
env_logger = { version = "0.8", default-features = false }
thiserror = { workspace = true }
icicle-fuzzing = { git = "https://github.com/icicle-emu/icicle-emu.git", rev = "638508b72f480f9be6fe2e267ef09de8f1541f9a" }
icicle-vm = { git = "https://github.com/icicle-emu/icicle-emu.git", rev = "638508b72f480f9be6fe2e267ef09de8f1541f9a" }
libafl = { version = "=0.16.1" }
libafl_bolts = { version = "=0.16.1" }
pcode = { git = "https://github.com/icicle-emu/icicle-emu.git", rev = "638508b72f480f9be6fe2e267ef09de8f1541f9a" }
num-bigint = { version = "0.4", features = ["serde"] }
petgraph = { version = "0.8.3", default-features = false, features = ["stable_graph"] }
num-traits = "0.2"
parking_lot = "0.12"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# `multiple-pymethods` lets the `RustExplorationManager` surface be split
# across several `#[pymethods]` blocks in sibling files. It pulls in
# `inventory`, which registers the blocks via linker sections at startup —
# supported on Linux/macOS/Windows and compatible with `abi3-py312`.
pyo3 = { version = "0.30.1", features = [
    "abi3-py312",
    "py-clone",
    "num-bigint",
    "indexmap",
    "multiple-pymethods",
] }
rangemap = "1.7.1"
regex = "1.11"
send_wrapper = "0.6.0"
smallvec = "1.15"
indexmap = { version = "2.14", features = ["serde"] }
fixedbitset = "0.5"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
rustc-hash = "2"
target-lexicon = "0.13.5"

# VEX Engine dependencies (optional, enabled by default)
z3 = { version = "0.21", optional = true }
# Direct z3-sys dep so we can call Z3 FP-theory FFI functions that are not
# exposed via z3-rs high-level API (sqrt, fma, to_fp_bv).
z3-sys = { version = "0.13", optional = true }
im = { version = "15.1", optional = true }
lru = { version = "0.12", optional = true }
# Work-stealing deque for the parallel exploration scheduler (angr-1ilq.3).
# Gated under vex-engine-z3 (the scheduler only exists alongside the Z3-backed
# StateMigrationPayload transport).
crossbeam-deque = { version = "0.8", optional = true }

# Not used from Rust: this is how the extension configures the Z3 that clarirs-z3 links against.
# Windows links against an import library — only a name-to-DLL mapping — and the z3-solver wheel
# ships none, so take the one from Z3's own release of the same version. setup.py points the other
# platforms at the wheel, and angr/_z3.py loads the wheel's libz3 at runtime everywhere.
[target.'cfg(windows)'.dependencies]
z3-sys = { version = "0.13", features = ["gh-release"] }

[dev-dependencies]
tempfile = "3.24.0"
quickcheck = "1.0"
quickcheck_macros = "1.0"
criterion = "0.5"

[[bench]]
name = "vex_engine"
harness = false
# Same required-features guard as the examples below (angr-c7xno.99): the bench
# drives `SymContext::add_constraint`, `bench_parse_smtlib2` and the z3 `Ast`
# API directly, so it only compiles with z3 present.
required-features = ["vex-engine-z3"]

# Examples gated behind engine features (bd angr-cagbn): they pull in
# feature-gated modules (`vex`, `memory`, `state`, z3 solver), so the no-z3
# nightly `cargo test` combos would fail to compile them without a
# required-features guard. cargo only builds an example when its required
# features are active.
[[example]]
name = "leak_probe"
required-features = ["vex-engine-z3"]
