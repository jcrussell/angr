[package]
name = "angr"
version = "0.1.0"
edition = "2024"

[lib]
name = "rustylib"
crate-type = ["cdylib", "rlib"]

[features]
# VEX engine with Z3 enabled by default; fuzzer is optional
default = ["vex-engine", "vex-engine-z3", "automaton"]
vex-engine = ["im", "lru", "thiserror"]
vex-engine-z3 = ["vex-engine", "z3", "z3-sys"]
fuzzer = ["icicle-fuzzing", "icicle-vm", "libafl", "libafl_bolts", "pcode"]
automaton = ["indexmap", "fixedbitset"]

[dependencies]
backtrace = "0.3.76"
parking_lot = "0.12"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
pyo3 = { version = "0.27.2", features = ["py-clone"] }
rangemap = "1.7.1"
rustc-hash = "2.1"
send_wrapper = "0.6.0"
smallvec = "1.15"
# Automaton module dependencies (optional, needs network to resolve)
indexmap = { version = "2.13", optional = true }
fixedbitset = { version = "0.5", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
log = "0.4"
# env_logger gives us `Filter` (RUST_LOG-style per-module log filters).
# We only use the `filter` module — no formatter / atty / color / humantime.
env_logger = { version = "0.8", default-features = false }
target-lexicon = "0.12.16"

# VEX Engine dependencies (optional, enabled by default)
z3 = { version = "0.19", optional = true }
# Direct z3-sys dep so we can call Z3 FP-theory FFI functions that are not
# exposed via z3-rs high-level API (sqrt, fma, to_fp_bv).
z3-sys = { version = "0.10", optional = true }
im = { version = "15.1", optional = true }
lru = { version = "0.12", optional = true }
thiserror = { version = "1.0", optional = true }

# Fuzzer dependencies (optional)
icicle-fuzzing = { git = "https://github.com/icicle-emu/icicle-emu.git", rev = "4d7ed93254a20b7e5c16bd7b0c6b46db49e1c72e", optional = true }
icicle-vm = { git = "https://github.com/icicle-emu/icicle-emu.git", rev = "4d7ed93254a20b7e5c16bd7b0c6b46db49e1c72e", optional = true }
libafl = { version = "=0.15.3", optional = true }
libafl_bolts = { version = "=0.15.3", optional = true }
pcode = { git = "https://github.com/icicle-emu/icicle-emu.git", rev = "4d7ed93254a20b7e5c16bd7b0c6b46db49e1c72e", optional = true }

[dev-dependencies]
tempfile = "3.24.0"
quickcheck = "1.0"
quickcheck_macros = "1.0"
criterion = "0.5"

[[bench]]
name = "vex_engine"
harness = false
