[package]
name = "angr-symex-native"
version = "0.1.0"
edition = "2024"
description = "Native SimProcedures and syscall handlers for angr's Rust engine, on the PyO3-free angr-symex-core."
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints.clippy]
# The same table as native/angr-bv: group entries at a lower priority so the
# specific settings win.
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
let_underscore_must_use = "deny"

[lib]
name = "angr_symex_native"

[features]
# Widens the format-string width/length parsers to the crate's public
# surface for the cargo-fuzz targets; native/angr's `fuzzing` turns it on.
fuzzing = []
# Widens the test-only `NativeSyscallRegistry::register` to the crate's
# public surface for the engine's tests. Dev-only: native/angr turns it on
# under [dev-dependencies].
testing = []

[dependencies]
angr-symex-core = { path = "../angr-symex-core" }
angr-vex = { path = "../angr-vex" }
log = "0.4.32"
thiserror = { workspace = true }
z3 = "0.21"

[dev-dependencies]
angr-symex-core = { path = "../angr-symex-core", features = ["testing"] }
