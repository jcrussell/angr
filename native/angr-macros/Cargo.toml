[package]
name = "angr-macros"
version = "0.1.0"
edition = "2024"
description = "Proc macros enforcing repo-specific call-site invariants for the rustylib engine (angr-sqfj8/angr-9ke6b whac-a-mole follow-up)."
license.workspace = true
readme.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
# Compile-fail harness: the unit tests in src/lib.rs prove a `compile_error!`
# token is *emitted*, only an end-to-end rustc run proves it actually halts
# compilation with that message (angr-03vl4.78).
trybuild = "1"
