name: Rust Nightly

# Fork-owned home of the Rust engine's slow gates (angr-vmi2l.303). They used to
# live in nightly-ci.yml, which is upstream's file and is kept byte-identical to
# it so upstream merges never clobber these jobs again. The CI gates table in
# docs/advanced-topics/rust_build.rst is the index of what runs where.
#
# Trigger choice:
# - `schedule` fires only from the default branch, so on its own it never gates
#   upstream-prep (where Rust development lands). It is kept so the cron starts
#   working once this file reaches the default branch.
# - `push` to upstream-prep is what actually gates that branch: work lands there
#   by local merge + push, not by pull request, so a `pull_request` filter on
#   upstream-prep would almost never fire. The `concurrency` block below cancels
#   a superseded run when merges are pushed back to back, so a burst of pushes
#   costs one full run rather than one per push.
# - `workflow_dispatch` for a manual run on any ref.
on:
  schedule:
  - cron: "17 3 * * *"
  push:
    branches:
      - upstream-prep
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark_regression:
    name: Benchmark Regression (full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.12
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run Rust exploration tests
        run: uv run pytest tests/engines/rust/ -v --tb=short
      - name: Run benchmark regression (fast + medium tier)
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        # --full adds MEDIUM_SUITE to FAST_SUITE, so the non-bimodal MEDIUM
        # benches gate at the default threshold (angr-rbcf) and the bimodal
        # ones are tracked for drift; --retry-failures 2 absorbs most bimodal
        # noise without overwriting the first measurement in the history
        # record, so the dashboard's time series stays honest.
        # The peak_memory_mb check is on by default and hard-fails here.
        # --check-counts: the TRACKED_METRICS count gate; COUNT_EXEMPT in
        # run_regression.py lists the exempted benches.
        # --correctness: every FAST + MEDIUM bench's own test() oracle under
        # the Rust engine (angr-imiwt). ci.yml::benchmark_regression runs the
        # same pass over the fast tier only, so a wrong answer on a MEDIUM
        # bench (the angr-acg99 sym-write shape) is caught only here.
        # The run_regression.py module docstring is the authority for every
        # flag above.
        run: |
          uv run python tests/benchmarks/run_regression.py \
            --full \
            --rust-only \
            --retry-failures 2 \
            --check-counts \
            --correctness \
            --history-record bench_history_record.json
        timeout-minutes: 16
      # Consumed by perf-dashboard.yml, which keys on this artifact name.
      - name: Upload benchmark history record
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bench-history-${{ github.sha }}
          path: bench_history_record.json
          if-no-files-found: warn
          retention-days: 90

  showcase_smoke:
    name: Showcase Demo Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.12
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      # Rot-proofs the showcase demos (angr-4n26m); the show_all.py docstring
      # holds the exit-code contract (a missing-corpus SKIP does not fail it).
      - name: Run showcase demo runner
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        run: uv run python tests/benchmarks/show_all.py --quick
        timeout-minutes: 10

  proxy_gates_on:
    name: Write-Through Proxy Gates On
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.12
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run Rust exploration tests with proxy gates on
        # The default-OFF write-through gates below are behaviorally clean when
        # forced on, so this job keeps their proxy paths from rotting while
        # disabled (angr-rpqk, bd memory
        # write-through-gate-promotion-keep-off-verdict; the export gates
        # joined in angr-5x6la). The per-gate semantics are in the
        # RustExplorationManager docstring in angr/exploration/rust_manager.py.
        # ANGR_RUST_USE_CALLBACK_REGISTER_PROXY is absent: the suite is green
        # with it, but it makes multi-successor callbacks share register writes
        # (angr-mx00p.112), which the suite does not cover.
        env:
          ANGR_RUST_USE_CALLBACK_SOLVER_PROXY: "1"
          ANGR_RUST_USE_EXPORT_CALLSTACK_PROXY: "1"
          ANGR_RUST_USE_EXPORT_MEMORY_PROXY: "1"
        run: uv run pytest tests/engines/rust/ --tb=short
        timeout-minutes: 10

  rss_leak_check:
    name: RSS Leak Check (mma_howtouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.12
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run leak check (10 main() iters under 4 GB RLIMIT_AS)
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        # The steady-state run of the 9maq bisection method; ci.yml's
        # rss_leak_check_smoke is the short PR-time variant. Threshold notes
        # are in the run_leak_check.py docstring.
        run: |
          uv run python tests/benchmarks/run_leak_check.py \
            --iters 10 --threshold 1.5 \
            --json > leak_check_report.json
        timeout-minutes: 10
      - name: Print leak check summary
        if: always()
        run: |
          if [ -f leak_check_report.json ]; then
            cat leak_check_report.json
          fi
      - name: Upload leak check report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: leak-check-report
          path: leak_check_report.json
          if-no-files-found: warn
          retention-days: 90

  valgrind_leak_check:
    name: Valgrind Leak Check (Rust core)
    runs-on: ubuntu-latest
    env:
      # z3-sys's `gh-release` feature statically links the matching Z3 release,
      # the same recipe as ci.yml::rust_test; the token lifts the anonymous
      # GitHub API rate limit.
      READ_ONLY_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      # No angr/binaries or angr-examples checkout and no uv sync: the probe is
      # a pure-Rust binary (native/angr/examples/leak_probe.rs) and the harness
      # is stdlib-only.
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      # Built here rather than by the harness so the Z3 feature can be passed;
      # both harness steps below then run with --no-build.
      - name: Build the leak probe
        run: cargo build --release --manifest-path native/angr/Cargo.toml --example leak_probe --features z3-sys/gh-release
        timeout-minutes: 20
      - name: Self-test the gate (an injected per-iteration leak must trip it)
        # Runs BEFORE the real gate so a green "no leak" result is trustworthy:
        # a leak gate never observed to fail is indistinguishable from one that
        # cannot. The run_valgrind_leak_check.py docstring has the history.
        run: python3 tests/benchmarks/run_valgrind_leak_check.py --no-build --self-test
        timeout-minutes: 15
      - name: Run valgrind memcheck leak gate
        # Gates the per-iteration leak slope, not an absolute byte count; the
        # run_valgrind_leak_check.py docstring explains why.
        run: |
          python3 tests/benchmarks/run_valgrind_leak_check.py \
            --no-build --max-bytes-per-iter 1.0 \
            --json > valgrind_leak_report.json
        timeout-minutes: 15
      - name: Print valgrind leak summary
        if: always()
        run: |
          if [ -f valgrind_leak_report.json ]; then
            cat valgrind_leak_report.json
          fi
      - name: Upload valgrind leak report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: valgrind-leak-report
          path: valgrind_leak_report.json
          if-no-files-found: warn
          retention-days: 90

  repeat_run_equality:
    name: Repeat-Run Result Equality (M2 determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.12
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run the M2 equality gate test (fast corpus, N=5)
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
          # test_repeat_run_equality.py skips its gate test unless this is set,
          # so a plain `pytest tests/benchmarks` stays fast. This job is the
          # thing that actually runs it.
          ANGR_REPEAT_EQUALITY_GATE: "1"
        run: uv run pytest tests/benchmarks/test_repeat_run_equality.py --tb=short
        timeout-minutes: 10
      - name: Run the equality sweep over the medium tier (N=5)
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        # Result equality only: the harness makes no timing assertions, so
        # bimodal timing variance cannot fail it.
        run: |
          uv run python tests/benchmarks/repeat_run_equality.py \
            --medium --runs 5 --json repeat_equality_report.json
        timeout-minutes: 20
      - name: Upload equality census
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: repeat-equality-report
          path: repeat_equality_report.json
          if-no-files-found: warn
          retention-days: 90

  parity_census:
    name: SimOption/Fallback Parity Census (flip-gate ledger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.12
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      # parity_census.py raises SystemExit when the rst matrix, the
      # rust_manager.py option ledgers and its own tables disagree
      # (angr-xz5uu).
      - name: Run the parity census (fails on docs/bridge drift)
        run: uv run python tests/benchmarks/parity_census.py
        timeout-minutes: 10
      # The checked-in artifact is the ledger readers cite; regenerate it and
      # fail if it moved, so it can never lag the harness.
      - name: Check the checked-in census artifact is current
        run: |
          uv run python tests/benchmarks/parity_census.py --json > /dev/null
          git diff --exit-code -- tests/benchmarks/parity_census.json
      - name: Upload parity census
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: parity-census
          path: tests/benchmarks/parity_census.json
          if-no-files-found: warn
          retention-days: 90

  default_engine_parity:
    name: Default Engine Parity (ANGR_DEFAULT_ENGINE=rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.12
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      # The whole-process half of angr-op0dn.14.6 (angr-op0dn.14.10): with
      # ANGR_DEFAULT_ENGINE=rust every project defaults to the Rust manager and
      # the STOCK tests must still pass unedited, so an ineligible workload
      # (test_actions.py above all) has to route back to Python transparently.
      # The in-process half is tests/engines/rust/test_default_engine_flag.py.
      - name: Run the stock parity subset with the Rust default engine ON
        env:
          ANGR_DEFAULT_ENGINE: rust
        run: uv run pytest tests/factory/ tests/engines/test_actions.py --tb=short
        timeout-minutes: 20
      # Makes the fallback observable rather than merely non-fatal; the module
      # self-skips when the env var is unset.
      - name: Assert ineligible workloads observably route to Python
        env:
          ANGR_DEFAULT_ENGINE: rust
        run: uv run pytest tests/engines/rust/test_default_engine_env_parity.py -v --tb=short
        timeout-minutes: 5
      # The inverse: with the env var unset the flag suite is unchanged.
      - name: Re-run the flag suite with the default engine OFF
        run: uv run pytest tests/engines/rust/test_default_engine_flag.py --tb=short
        timeout-minutes: 5

  property_fuzzer:
    name: Differential Property Fuzzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.12
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run property-based differential fuzzer
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        # The broad sweep; ci.yml's property_fuzzer_quick is the PR-time smoke.
        # --strict fails on any divergence not on the rust_only/bimodal
        # allow-list. The seed is fixed for reproducibility; bump it on purpose
        # to surface new (example, strategy) pairs.
        run: |
          uv run python tests/benchmarks/property_fuzzer.py \
            --trials 50 --seed 1 --strict \
            --report property_fuzzer_report.json
        timeout-minutes: 20
      - name: Upload fuzzer report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: property-fuzzer-report
          path: property_fuzzer_report.json
          if-no-files-found: warn

  findall_worker_invariance:
    name: Find-All Worker-Count Invariance (parallel scheduler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.12
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run the find-all worker-count-invariance gate
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        # Structural gate, not wall-clock: the found-set fingerprint must be
        # identical across every worker count and rep. Same command as
        # `make gate-findall`; DEFAULT_BENCHES in run_findall_gate.py is the
        # corpus.
        run: |
          uv run python tests/benchmarks/run_findall_gate.py \
            --json findall_gate_report.json
        timeout-minutes: 30
      - name: Upload find-all gate report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: findall-gate-report
          path: findall_gate_report.json
          if-no-files-found: warn
          retention-days: 90

  cargo_deny:
    # RustSec advisory-DB + license scan over the native crate's dependency
    # graph. Not PR-time: the advisory DB is a moving target, so a new advisory
    # can redden a green tree with no code change; this is a drift signal, not
    # a PR blocker (angr-qwyti.7). native/angr/deny.toml documents the policy.
    name: cargo-deny (advisories + licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: taiki-e/install-action@6887963ccf37a9ddcd8c5fa4baeb3e1e5fd61fa1 # v2
        with:
          tool: cargo-deny
      # --config is explicit so the run cannot silently fall back to built-in
      # defaults if cargo-deny's config discovery stops finding the file.
      - name: Run cargo-deny check
        run: cargo deny --manifest-path native/angr/Cargo.toml check --config native/angr/deny.toml
