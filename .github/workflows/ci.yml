name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  ci:
    uses: angr/ci-settings/.github/workflows/angr-ci.yml@master

  smoketest:
    name: Test installation
    strategy:
      matrix:
        os: [windows-2022, macos-15-intel]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: startsWith(runner.os, 'windows')
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v6
      - name: Sync dependencies
        run: uv sync -p 3.12
      - name: Collect tests
        run: uv run pytest --collect-only tests

  rust_check:
    name: Rust Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          components: clippy, rustfmt
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo fmt --all -- --check
      # Rustdoc intra-doc links (angr-9ke6b.225). Broken links render as plain
      # text, so a stale `[`Foo::bar`]` citation silently loses its
      # cross-reference instead of failing loudly. Count is zero as of this
      # lane being added; `-D warnings` keeps it there.
      #
      # `--document-private-items` is load-bearing (angr-sqfj8.144): almost
      # every item in this crate is `pub(crate)`/private, so without it rustdoc
      # never visits their docs and the lane passed while 83 broken links sat in
      # the tree. Do not drop it.
      #
      # `--workspace` is load-bearing too (angr-pr0tj): pinned at
      # `--manifest-path native/angr/Cargo.toml`, this lane never documented
      # `native/angr-macros`, and two `private_intra_doc_links` errors sat red
      # there from the day the `MergePolicy` derive was written. Keep it
      # workspace-wide so a new member crate is covered on arrival.
      - name: Rustdoc link check
        run: cargo doc --workspace --no-deps --all-features --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Silent-fallback tagging audit
        run: python3 tools/audit_silent_fallback.py
      # Process-rule companion to the tagging audit above (see the "What NOT
      # to chase with more tests" analysis cited in its docstring): a new
      # cat_b/cat_c silent_default!()/SILENT() site is exactly the "silently
      # wrong instead of loud error" bug shape this repo's audits keep
      # re-finding (39 historical instances), and this repo's own bug-fix
      # commits ship a same-commit regression test 25/25 sampled times — so
      # require the same discipline pre-merge. Diff-based, not baseline-gated
      # like its sibling (there is no "known-untagged" set to baseline — a
      # new site is judged solely against the current diff), but still runs
      # `--self-test` first, same reasoning as the rounding-mode / SP-default
      # audits above: a lint that has never been seen to fire is
      # indistinguishable from one that cannot.
      - name: Silent-fallback / regression-test pairing audit
        run: |
          python3 tools/audit_silent_fallback_test_pairing.py --self-test
          python3 tools/audit_silent_fallback_test_pairing.py
      - name: Stale line-number-citation check
        run: python3 tools/check_line_citations.py
      # bd angr-qwyti.3: interpreting a Z3 check() outcome must go through the
      # single forcing-function SatOutcome::decided, which turns Unknown
      # (timeout/incompleteness) into None so every call site is forced to
      # decide what a timeout means. Conflating Unknown with Unsat is the
      # angr-ph300.43 / angr-n0irt.1 bug class — it fabricates extrema,
      # permanently pins sat_cache=false, and prunes feasible branches. This
      # script has existed since 8c3dae2fa but was never wired into CI.
      - name: SatResult boolean-collapse audit
        run: python3 tools/audit_satresult.py
      # angr-91vj9.7: a `*_rm` VEX helper whose concrete closure drops the
      # rounding mode compiles cleanly (a `_rm` parameter is the *sanctioned*
      # spelling of "unused"), so the symbolic and concrete paths can silently
      # disagree on RZ/RU/RD (angr-c7xno.85 / f64_to_f32_rm). Baseline-gated
      # like the three checks above; the baseline is empty and should stay so.
      # `--self-test` runs first, same reasoning as the nightly valgrind gate:
      # a lint that has never been seen to fire is indistinguishable from one
      # that cannot. It classifies a synthetic threaded/dropped/exempt trio.
      - name: VEX rounding-mode threading audit
        run: |
          python3 tools/audit_rounding_mode_threading.py --self-test
          python3 tools/audit_rounding_mode_threading.py
      # angr-91vj9.4: "silently default a symbolic/unreadable stack pointer or
      # return address to 0" has been found and fixed three separate times
      # (angr-sqfj8.62, angr-sqfj8.63, angr-c7xno.29) because the raw accessor
      # and the logged `_or_log` helper are equally easy to reach for. Same
      # baseline + `--self-test`-first shape as the rounding-mode audit above;
      # the baseline is empty and should stay so.
      - name: SP/return-address default-to-zero audit
        run: |
          python3 tools/audit_sp_default_zero.py --self-test
          python3 tools/audit_sp_default_zero.py
      # angr-03vl4 round-4 retrospective: integer overflow/wraparound on
      # guest-controlled or Z3-derived address/size values was the dominant
      # bug class (3 P1s, 6 subsystems) -- [profile.release] has no
      # overflow-checks, so a bare +/- silently wraps in the shipped .so
      # instead of panicking. Same baseline + `--self-test`-first shape as
      # the rounding-mode / SP-default audits above. The baseline currently
      # holds 99 pre-existing sites in memory/interpreter/symbolic/state
      # deferred for triage (angr-xloth) -- syscalls/ and procedures/ are
      # fully clean.
      - name: Integer overflow / wraparound audit
        run: |
          python3 tools/audit_overflow_wraparound.py --self-test
          python3 tools/audit_overflow_wraparound.py

  rust_test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.12"
      # `release-checked` (repo-root Cargo.toml) is `release` plus
      # overflow-checks and debug-assertions, with default features on. That
      # combination exists only here and in the ralph gate: every other
      # default-feature cargo-test lane is plain `--release` (debug-assertions
      # off), and the debug-assertions-on `rust_feature_flags` lanes are
      # `--no-default-features`, which #[cfg]s the `vex-engine-z3` block out.
      # So this is the ONLY job that runs the debug-only Z3 guards, e.g.
      # `SymContext::to_snapshot`'s residual/assumed accounting bound
      # (angr-03vl4.84). Keep it on `release-checked`, not `--release`.
      - run: cargo test --profile release-checked

  rust_feature_flags_check:
    # PR-time compile gate for the four feature-flag combos covered by the
    # nightly `rust_feature_flags` matrix (no-features, vex-engine,
    # vex-engine+vex-engine-z3, automaton). Nightly runs full
    # `cargo test` + `feature_flag_smoke` for every combo; this PR-time
    # variant runs `cargo check` for all four combos (cheap compile gate),
    # PLUS `cargo test` + `feature_flag_smoke` for the no-default-features
    # combo only — the cheapest-to-build combo and the historical failure
    # mode (angr-ph300.79 broke `--no-default-features`). This closes the
    # "broken combo survives until the next nightly" gap for the highest-
    # value combo without paying the full 4x test build at PR time.
    # See bd memories `tier-drift-ci-gate` / `invariant-feature-flag-smoke`
    # (angr-1yge9.14): every nightly gate should have a PR-time variant to
    # avoid "broken until next cron".
    name: Rust Feature Flags (PR check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        features:
          - ""  # no features
          - "vex-engine"  # VEX engine without Z3
          - "vex-engine,vex-engine-z3"  # VEX engine with Z3
          - "automaton"  # automaton only
      fail-fast: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      # -D warnings (angr-sqfj8.139): this is the only lane that compiles the
      # #[cfg(not(feature = "vex-engine-z3"))] arms — neither `make check` nor
      # the `--all-features` clippy gate reaches them — so warnings must fail
      # here or unused-import/dead-code rot accumulates invisibly. Mirrors
      # `make check-no-z3`.
      # --all-targets (angr-c7xno.99): without it only the lib is compiled, so
      # the no-z3 test/bench targets were gated by nothing and had rotted to 41
      # errors — the reason the no-z3 mock arms had zero runtime coverage.
      - name: Cargo check with features "${{ matrix.features }}"
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --manifest-path native/angr/Cargo.toml --no-default-features --features "${{ matrix.features }}" --all-targets
      # Execute (not just compile) the no-default-features combo at PR time —
      # the cheapest build and the combo that has historically broken
      # (angr-ph300.79). The full in-crate `cargo test --no-default-features`
      # is now green (angr-cagbn gated the z3-dependent test modules) and runs
      # here as the primary gate; it subsumes the feature_flag_smoke integration
      # test, which cargo test also builds+runs. The nightly `rust_feature_flags`
      # job remains the backstop for full test execution across all four combos.
      - name: Full test (no-default-features)
        if: matrix.features == ''
        run: cargo test --manifest-path native/angr/Cargo.toml --no-default-features

  python_baseline:
    # Fast subset of the vanilla angr test suite — proves rust-symex
    # changes did not regress the Python engine. Distinct from the
    # delegated `ci` job (which runs the full suite at master speeds);
    # this gate fires per-PR with a sub-5-minute budget. Test list lives
    # in $PYTHON_BASELINE_TESTS in the Makefile — keep both in sync.
    # Does NOT build the Rust extension: these tests exercise vanilla
    # Python angr paths only.
    name: Python-engine baseline regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          path: angr
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv --directory angr sync -p 3.10
      - name: Run Python-engine baseline tests
        run: uv --directory angr run make test-python-baseline
        timeout-minutes: 6

  benchmark_regression:
    name: Benchmark Regression (fast tier)
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Rust build dominates (~5-7m cold); bench step itself capped at 5m below
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Validate EXAMPLE_CATALOG tier metadata
        # Stdlib-only sanity check (~50ms): compares the declared `tier`
        # field in run_single.EXAMPLE_CATALOG against the measured
        # `rust_time` in baseline_timings.json. Fails fast (before the
        # ~5-7m Rust build) when a bench has crossed a tier boundary —
        # see tests/benchmarks/validate_tier.py for the ±10% boundary
        # tolerance and skip rules. Edge-case helper unit tests run
        # separately as `Run validate_tier unit tests` (after uv sync).
        run: python3 tests/benchmarks/validate_tier.py
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Run validate_tier unit tests
        # Edge-case unit tests for the helpers inside validate_tier.py
        # (classify bucket boundaries, within_boundary ±10% slack math
        # incl. fast's zero-lower-bound and very_slow's unbounded upper,
        # audit source-field selection). ~30 ms wall, stdlib + pytest
        # only — no `angr` import, no Rust extension required. Run here
        # (after `uv sync`, before the ~5-7 m Rust build) so a helper
        # regression fails fast. Complements the earlier
        # `python3 tests/benchmarks/validate_tier.py` step, which only
        # exercises the real catalog vs real baseline integration path.
        run: uv run pytest tests/benchmarks/test_validate_tier.py -q --tb=short
      - name: Check baseline_counters.json coverage
        # Stdlib-only static check (~50ms, no Rust extension): fails when
        # baseline_counters.json is missing a key for any non-bimodal
        # fast+medium SUITE bench. baseline_counters.json is refreshed
        # manually, so a newly-added bench silently rots its bench_diff
        # regression report until someone reruns --update-counters; this
        # gate surfaces that drift before the ~5-7 m Rust build. --full so
        # MEDIUM_SUITE keys are checked too. Helper unit tests run as
        # tests/benchmarks/test_counter_coverage.py.
        run: uv run python tests/benchmarks/run_regression.py --check-counter-coverage --full
      - name: Run counter-coverage unit tests
        run: uv run pytest tests/benchmarks/test_counter_coverage.py -q --tb=short
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run fast-tier benchmark regression
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        # --rust-only: skip the Python comparison run (cuts runtime in half).
        # --skip-bimodal: exclude Z3-nondeterministic benches whose 2x bimodal
        #   timing routinely exceeds the 15% regression threshold even on a
        #   stable HEAD (see bd memory `invariant-bimodal-variance-benchmarks`).
        # --threshold 0.15: explicit (matches the default) — 15% slower than
        #   baseline_timings.json fails the gate.
        # --retry-failures 2: sub-second smoke benches are noise-dominated; the
        #   same diff can flip pass/fail across consecutive runs (see bd memory
        #   `benchmark-regression-noise-floor`). Retrying clears spurious flags
        #   without touching baselines (the riskier alternative — see memory
        #   `avoid-update-baseline-without-verification`).
        # peak_memory_mb: the RSS regression check is on by default and now
        #   hard-fails the PR gate too (angr-iwmp). It soaked warn-only on this
        #   fast path while the nightly gate hard-failed; the soak stayed clean,
        #   so --memory-warn-only was dropped. The 0.5 (50%) --memory-threshold
        #   default keeps allocator/page-cache RSS variance from false-flagging;
        #   if a future RSS-heavy change proves noisy, raise that threshold
        #   rather than re-adding warn-only (see bd angr-iwmp / angr-wcxi).
        # --check-counts: enforce the TRACKED_METRICS algorithmic-count gate
        #   (callback_count/state_creations/steps). --skip-bimodal scopes this
        #   to the fast tier, whose count baselines were soak-validated as
        #   deterministic (0% variance / 5 runs, angr-bq9v). Hard fail — there
        #   is no warn-only mode, but the counts are deterministic so warmup
        #   variance can't false-positive the way RSS can.
        run: uv run python tests/benchmarks/run_regression.py --rust-only --skip-bimodal --threshold 0.15 --retry-failures 2 --check-counts
        timeout-minutes: 5

  property_fuzzer_quick:
    # PR-time smoke for tests/benchmarks/property_fuzzer.py — the nightly
    # gate (nightly-ci.yml::property_fuzzer) runs 50 trials, but a PR
    # introducing a Rust↔Python output divergence would otherwise sit
    # broken until the next cron. 10 trials × ~5s ≈ 50-60s wall plus the
    # Rust build; --seed 1 keeps the failure surface reproducible.
    # See bd memory `invariant-ci-gate-hygiene` rule (1).
    name: Property Fuzzer (PR smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Rust build dominates (~5-7m cold); fuzzer step capped at 5m below
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run property-based differential fuzzer (10 trials)
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        # --strict fails on any new (example, strategy) divergence not on
        # the rust_only/bimodal allow-list. Nightly still runs 50 trials
        # for broader coverage; this PR-time job catches the obvious case.
        run: |
          uv run python tests/benchmarks/property_fuzzer.py \
            --trials 10 --seed 1 --strict \
            --report property_fuzzer_quick_report.json
        timeout-minutes: 5
      - name: Upload fuzzer report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: property-fuzzer-quick-report
          path: property_fuzzer_quick_report.json
          if-no-files-found: warn

  rss_leak_check_smoke:
    # PR-time smoke for tests/benchmarks/run_leak_check.py — the nightly
    # gate (nightly-ci.yml::rss_leak_check) runs --iters 10 / --threshold 1.5
    # under a 4 GB RLIMIT_AS, codifying the 9maq bisection method (the
    # pre-293aa8163 Callable leak was ~6.6x in mma_howtouse). A PR that
    # re-introduces that leak class would otherwise sit broken until the
    # next nightly cron.
    #
    # N=3 is ~15s of bench-execution. The threshold is tighter than nightly
    # (1.3x vs 1.5x) because warmup happens entirely in iter1; iters 2-3
    # should be flat on healthy main. Steady-state variance still belongs
    # to the nightly N=10 run. See bd memory `invariant-ci-gate-hygiene`
    # rule (1) and CLAUDE.md "Nightly RSS leak check" for threshold notes.
    name: RSS Leak Check (PR smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Rust build dominates (~5-7m cold); leak step capped at 5m below
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run leak check (3 main() iters under 4 GB RLIMIT_AS)
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        run: |
          uv run python tests/benchmarks/run_leak_check.py \
            --iters 3 --threshold 1.3 \
            --json > leak_check_smoke_report.json
        timeout-minutes: 5
      - name: Print leak check summary
        if: always()
        run: |
          if [ -f leak_check_smoke_report.json ]; then
            cat leak_check_smoke_report.json
          fi
      - name: Upload leak check report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: leak-check-smoke-report
          path: leak_check_smoke_report.json
          if-no-files-found: warn
