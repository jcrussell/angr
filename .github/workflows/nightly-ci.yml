name: Nightly CI

on:
  schedule:
  - cron: "0 0 * * *"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/nightly-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: angr/ci-settings/.github/workflows/angr-ci.yml@master
    with:
      nightly: true
    secrets: inherit
  windows:
    name: Test Windows
    runs-on: windows-2022
    strategy:
      matrix:
        runner_id: [1, 2, 3, 4, 5]
      fail-fast: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          path: angr
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v6
      - name: Setup Java for pysoot
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Sync dependencies
        run: uv --directory angr sync -p 3.12
      - name: Run pytest
        run: uv --directory angr run pytest -n auto --splits 5 --group ${{ matrix.runner_id }} tests
  macos:
    name: Test macOS
    runs-on: macos-15
    strategy:
      matrix:
        runner_id: [1, 2, 3]
      fail-fast: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          path: angr
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v6
      - name: Sync dependencies
        run: uv --directory angr sync -p 3.12
      - name: Run pytest
        run: uv --directory angr run pytest -n auto --splits 3 --group ${{ matrix.runner_id }} tests

  rust_feature_flags:
    name: Rust Feature Flags
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""  # no features
          - "vex-engine"  # VEX engine without Z3
          - "vex-engine,vex-engine-z3"  # VEX engine with Z3
          - "automaton"  # automaton only
      fail-fast: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.10"
      # -D warnings (angr-sqfj8.139): mirrors the PR-time
      # `rust_feature_flags_check` lane and `make check-no-z3`. Only the
      # check step is gated — the `cargo test` steps below build test-only
      # code the zero-warning bar has never covered.
      - name: Build with features "${{ matrix.features }}"
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --manifest-path native/angr/Cargo.toml --no-default-features --features "${{ matrix.features }}"
      - name: Test with features "${{ matrix.features }}"
        run: cargo test --manifest-path native/angr/Cargo.toml --no-default-features --features "${{ matrix.features }}"
      - name: Behavioral smoke test with features "${{ matrix.features }}"
        run: cargo test --manifest-path native/angr/Cargo.toml --no-default-features --features "${{ matrix.features }}" --test feature_flag_smoke

  libvex_ffi_tests:
    # The `libvex-ffi` cargo feature is default-OFF in Cargo.toml but default-ON
    # in the shipped wheel (setup.py::_rust_features, angr-3trr7), so nothing in
    # the `rust_feature_flags` matrix above ever *runs* vex/libvex_lifter.rs's
    # unit tests or libvex_corpus_tests.rs — the Stage-1 native-vs-pyvex parity
    # gate. PR-time `cargo clippy --all-features` compiles them but never
    # executes them. This lane closes that gap (angr-kl5qt). Nightly rather
    # than PR-time because it needs pyvex installed to link libpyvex.so.
    name: libVEX FFI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.12"
      # build.rs::find_pyvex_lib_dir shells out to `python3 -c "import pyvex"`
      # to locate libpyvex.so, then emits link-search/link-lib/rpath for it.
      - name: Install pyvex
        run: python -m pip install pyvex
      - name: Test with features "libvex-ffi"
        run: cargo test --manifest-path native/angr/Cargo.toml --release --features libvex-ffi --lib libvex

  fuzzer_feature_tests:
    # Same gap as libvex_ffi_tests above, for the `fuzzer` feature (angr-j4glo):
    # it is default-off in Cargo.toml and absent from every cargo-test
    # invocation, so src/fuzzer/{corpus,executor}_tests.rs are compiled by
    # PR-time `cargo clippy --all-features` but never executed. Nightly rather
    # than PR-time because the icicle-emu git deps + libafl make for a slow
    # cold build and the fuzzer is a dev tool, not shipped in the wheel.
    name: Fuzzer Feature Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.12"
      - name: Test with features "fuzzer"
        run: cargo test --manifest-path native/angr/Cargo.toml --release --features fuzzer --lib fuzzer

  benchmark_regression:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run Rust exploration tests
        run: uv run pytest tests/engines/rust/ -v --tb=short
      - name: Run benchmark regression (fast + medium tier)
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        # --full: covers FAST_SUITE (22) + MEDIUM_SUITE (10) benchmarks
        # so the 7 non-bimodal MEDIUM benches (sym-write, flareon2015_5/10,
        # ekopartyctf2016_rev250, csaw_wyvern, codegate_2017-angrybird,
        # mma_howtouse) actually gate at 15% threshold. Previously these
        # were never auto-checked — angr-rbcf closed this gap. The 3
        # bimodal MEDIUM members (securityfest_fairlight,
        # ekopartyctf2016_sokohashv2, hackcon2016_angry-reverser) are
        # included for drift signal (matches existing FAST behavior with
        # bimodal google2016_unbreakable_1); --retry-failures 2 absorbs
        # most bimodal noise.
        # The peak_memory_mb regression check is on by default (50% over
        # baseline) and runs here as a hard fail — distinct from
        # rss_leak_check, which gates iterative growth on one bench. The PR
        # gate runs the same check in --memory-warn-only mode during the soak.
        # --retry-failures 2: see ci.yml::benchmark_regression for rationale.
        # The retry only re-runs failures and does NOT overwrite the recorded
        # measurement in the history record, so the dashboard's time-series
        # signal still reflects the first measurement of each bench.
        # timeout-minutes bumped 8 → 12 to absorb worst-case MEDIUM tier
        # runtime (~96s baseline + 219s worst-case bimodal retries).
        # --check-counts: hard-enforce the TRACKED_METRICS algorithmic-count
        # gate. The bimodal + MEDIUM-tier benches are exempted in-script
        # (COUNT_EXEMPT in run_regression.py) until they get their own
        # counter-stability soak; the fast tier is soak-validated (angr-bq9v).
        run: |
          uv run python tests/benchmarks/run_regression.py \
            --full \
            --rust-only \
            --retry-failures 2 \
            --check-counts \
            --history-record bench_history_record.json
        timeout-minutes: 12
      - name: Upload benchmark history record
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bench-history-${{ github.sha }}
          path: bench_history_record.json
          if-no-files-found: warn
          retention-days: 90

  showcase_smoke:
    name: Showcase Demo Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      # Rot-proofs the blog-post showcase (angr-4n26m): every show_*.py demo
      # must still run green from a clean checkout, else the post's
      # reproducibility claim silently breaks. --quick runs the fast subset
      # where a demo supports one; the runner exits non-zero iff a demo
      # genuinely regresses (a missing-corpus SKIP does not fail it).
      - name: Run showcase demo runner
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        run: uv run python tests/benchmarks/show_all.py --quick
        timeout-minutes: 10

  proxy_gates_on:
    name: Write-Through Proxy Gates On
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run Rust exploration tests with proxy gates on
        # angr-rpqk write-through gate-promotion verdict (bd memory
        # write-through-gate-promotion-keep-off-verdict): the gates below
        # are behaviorally clean (full tests/engines/rust/ suite green with
        # them forced on) but stay default-OFF in production because the
        # CALLBACK_REGISTER_PROXY gate corrupts PC / state.addr reads (breaks
        # callable find/avoid predicates and stash accessors, times out
        # unmapped_analysis). This nightly job exercises the clean gates-on
        # proxy paths so they cannot rot while disabled. REGISTER_PROXY is
        # intentionally excluded pending its addr-corruption fix
        # (angr-4rq7); do NOT add it here until that lands.
        #
        # The two EXPORT proxy gates (angr-5x6la) were triaged forced-on:
        # 982/982 rust suite green + fauxware fast-tier bench clean, so they
        # join the soak. Closes the angr-sluuj.3 coverage gap where the
        # export-pipeline proxies had only precedence-contract tests.
        #
        # CALLBACK_MEMORY_PROXY was flipped default-ON (angr-grji4 human-GO
        # 2026-07-15); the explicit "1" below is now redundant but kept for
        # symmetry with the other soaked gates. Its opt-OUT is =0.
        env:
          ANGR_RUST_USE_CALLBACK_MEMORY_PROXY: "1"
          ANGR_RUST_USE_CALLBACK_SOLVER_PROXY: "1"
          ANGR_RUST_USE_CALLBACK_CALLSTACK_PROXY: "1"
          ANGR_RUST_USE_SIMPROC_FORK_VIA_RUST: "1"
          ANGR_RUST_USE_EXPORT_CALLSTACK_PROXY: "1"
          ANGR_RUST_USE_EXPORT_MEMORY_PROXY: "1"
        run: uv run pytest tests/engines/rust/ --tb=short
        timeout-minutes: 10

  rss_leak_check:
    name: RSS Leak Check (mma_howtouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run leak check (10 main() iters under 4 GB RLIMIT_AS)
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        # Codifies the 9maq bisection method into a nightly gate. The pre-fix
        # mma_howtouse leak was 286 MB -> 1888 MB (~6.6x); current main is
        # within 0.5%. Threshold 1.5x flags any new >=2x regression with margin.
        # See CLAUDE.md "Nightly RSS leak check" for threshold tuning notes.
        run: |
          uv run python tests/benchmarks/run_leak_check.py \
            --iters 10 --threshold 1.5 \
            --json > leak_check_report.json
        timeout-minutes: 10
      - name: Print leak check summary
        if: always()
        run: |
          if [ -f leak_check_report.json ]; then
            cat leak_check_report.json
          fi
      - name: Upload leak check report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: leak-check-report
          path: leak_check_report.json
          if-no-files-found: warn
          retention-days: 90

  valgrind_leak_check:
    name: Valgrind Leak Check (Rust core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      # No angr/binaries or angr-examples checkout and no uv sync: the probe is
      # a pure-Rust binary (native/angr/examples/leak_probe.rs) with no Python
      # in the process, and the harness is stdlib-only. libz3-dev supplies the
      # z3.h that z3-sys bindgen needs for a bare `cargo build`.
      - name: Install valgrind + Z3 headers
        run: sudo apt-get update && sudo apt-get install -y valgrind libz3-dev pkg-config
      - name: Self-test the gate (injected 64 B/iter leak must trip it)
        # A leak gate that has never been observed to fail is indistinguishable
        # from one that CANNOT fail -- and this one silently could not, at first:
        # release-mode LLVM elided the `forget(Box::new(..))` the injector
        # originally used. Run the self-test BEFORE the real gate so a green
        # "no leak" result below is trustworthy.
        run: python3 tests/benchmarks/run_valgrind_leak_check.py --self-test
        timeout-minutes: 15
      - name: Run valgrind memcheck leak gate
        # Gates the per-iteration leak SLOPE (definitely+indirectly lost bytes at
        # 10N vs N iterations), not an absolute byte count: the probe drops
        # everything it allocates, so a correct engine leaks a constant baseline
        # of one-time z3/lazy-static bytes that varies by distro. Growth is the
        # defect. Measured 0.00 B/iter on this branch; threshold 1.0 B/iter.
        run: |
          python3 tests/benchmarks/run_valgrind_leak_check.py \
            --no-build --max-bytes-per-iter 1.0 \
            --json > valgrind_leak_report.json
        timeout-minutes: 15
      - name: Print valgrind leak summary
        if: always()
        run: |
          if [ -f valgrind_leak_report.json ]; then
            cat valgrind_leak_report.json
          fi
      - name: Upload valgrind leak report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: valgrind-leak-report
          path: valgrind_leak_report.json
          if-no-files-found: warn
          retention-days: 90

  repeat_run_equality:
    name: Repeat-Run Result Equality (M2 determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run the M2 equality gate test (fast corpus, N=5)
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
          # The gate test in tests/benchmarks/test_repeat_run_equality.py is
          # skipped unless this is set, so that a plain `pytest tests/benchmarks`
          # stays millisecond-fast. This job is the thing that actually runs it.
          ANGR_REPEAT_EQUALITY_GATE: "1"
        run: uv run pytest tests/benchmarks/test_repeat_run_equality.py --tb=short
        timeout-minutes: 10
      - name: Run the equality sweep over the medium tier (N=5)
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        # Result-equality only — this harness makes zero timing assertions, so
        # the bimodal benches' timing variance cannot fail it (they are excluded
        # from the gated set anyway; see BIMODAL_BENCHMARKS in run_regression).
        run: |
          uv run python tests/benchmarks/repeat_run_equality.py \
            --medium --runs 5 --json repeat_equality_report.json
        timeout-minutes: 20
      - name: Upload equality census
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: repeat-equality-report
          path: repeat_equality_report.json
          if-no-files-found: warn
          retention-days: 90

  parity_census:
    name: SimOption/Fallback Parity Census (flip-gate ledger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      # parity_census.py carries its own drift guards: _docs_matrix() and
      # collect() raise SystemExit when the rst matrix, the rust_manager.py
      # option ledgers, and the census's own tables disagree. Nothing ran it in
      # CI until angr-xz5uu, which is exactly how the _EXONERATED table went
      # stale by two demoted-honored options.
      - name: Run the parity census (fails on docs/bridge drift)
        run: uv run python tests/benchmarks/parity_census.py
        timeout-minutes: 10
      # The checked-in artifact is the ledger readers cite; regenerate it and
      # fail if it moved, so it can never lag the harness again.
      - name: Check the checked-in census artifact is current
        run: |
          uv run python tests/benchmarks/parity_census.py --json > /dev/null
          git diff --exit-code -- tests/benchmarks/parity_census.json
      - name: Upload parity census
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: parity-census
          path: tests/benchmarks/parity_census.json
          if-no-files-found: warn
          retention-days: 90

  default_engine_parity:
    name: Default Engine Parity (ANGR_DEFAULT_ENGINE=rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      # The other half of angr-op0dn.14.6's acceptance (angr-op0dn.14.10). The
      # in-repo half — tests/engines/rust/test_default_engine_flag.py — pins the
      # flag from a stock process. This job pins the whole-process regime: with
      # ANGR_DEFAULT_ENGINE=rust set, EVERY project in the subset below defaults
      # to the Rust manager, and the STOCK tests must still pass with zero test
      # edits. That is the real claim of the auto-dispatcher: raising the default
      # cannot weaken the eligibility gate, so an ineligible workload (the
      # action-tracking ones in test_actions.py above all) has to route back to
      # Python transparently rather than raise or diverge.
      #
      # These modules need the angr/binaries checkout, which is why this could
      # not be validated on the dev box and lives here instead.
      - name: Run the stock parity subset with the Rust default engine ON
        env:
          ANGR_DEFAULT_ENGINE: rust
        run: uv run pytest tests/factory/ tests/engines/test_actions.py --tb=short
        timeout-minutes: 20
      # Makes the fallback *observable* rather than merely non-fatal: asserts a
      # TRACK_MEMORY_ACTIONS state lands on a plain SimulationManager and says so
      # via mgr.dispatch_reason. This module self-skips when the env var is unset,
      # so it is inert in every other job and in a plain local pytest run.
      - name: Assert ineligible workloads observably route to Python
        env:
          ANGR_DEFAULT_ENGINE: rust
        run: uv run pytest tests/engines/rust/test_default_engine_env_parity.py -v --tb=short
        timeout-minutes: 5
      # Guards the inverse: with the env var UNSET the suite must be byte-for-byte
      # the same as before the flag existed (the "flag off = zero diff" invariant).
      - name: Re-run the flag suite with the default engine OFF
        run: uv run pytest tests/engines/rust/test_default_engine_flag.py --tb=short
        timeout-minutes: 5

  property_fuzzer:
    name: Differential Property Fuzzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run property-based differential fuzzer
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        # 50 trials × ~5s/trial ≈ 4–5 min. --strict fails the run on any
        # NEW divergence (i.e. not on the rust_only/bimodal allow-list).
        # Seed is fixed for reproducibility; bump it intentionally to
        # surface new (example, strategy) pairs.
        run: |
          uv run python tests/benchmarks/property_fuzzer.py \
            --trials 50 --seed 1 --strict \
            --report property_fuzzer_report.json
        timeout-minutes: 20
      - name: Upload fuzzer report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: property-fuzzer-report
          path: property_fuzzer_report.json
          if-no-files-found: warn

  findall_worker_invariance:
    name: Find-All Worker-Count Invariance (parallel scheduler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run the find-all worker-count-invariance gate
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        # Structural gate, NOT wall-clock: the found-set fingerprint (multiset
        # of found pcs) must be identical across every worker count and rep.
        # Default corpus is the two in-repo synthetic find-all benches; 2
        # benches x 3 worker counts x 3 reps = 18 run_single children, ~12 min.
        run: |
          uv run python tests/benchmarks/run_findall_gate.py \
            --json findall_gate_report.json
        timeout-minutes: 30
      - name: Upload find-all gate report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: findall-gate-report
          path: findall_gate_report.json
          if-no-files-found: warn
          retention-days: 90

  cargo_deny:
    # RustSec advisory-DB + license scan over the native crate's dependency
    # graph (config: native/angr/deny.toml). Nightly-only, not PR-time: the
    # advisory DB is a moving target so a new advisory can redden a green tree
    # with no code change, and this is a drift signal rather than a PR blocker
    # (angr-qwyti.7). The advisories check is the deterministic hard gate; the
    # licenses check is best-effort against a broad allow-list in deny.toml --
    # a first-run license miss reddens the nightly (not a PR) and is fixed by
    # appending the missing SPDX id there.
    name: cargo-deny (advisories + licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: taiki-e/install-action@6887963ccf37a9ddcd8c5fa4baeb3e1e5fd61fa1 # v2
        with:
          tool: cargo-deny
      - name: Run cargo-deny check
        run: cargo deny --manifest-path native/angr/Cargo.toml check
