name: Nightly CI

on:
  schedule:
  - cron: "0 0 * * *"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/nightly-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: angr/ci-settings/.github/workflows/angr-ci.yml@master
    with:
      nightly: true
    secrets: inherit
  windows:
    name: Test Windows
    runs-on: windows-2022
    strategy:
      matrix:
        runner_id: [1, 2, 3, 4, 5]
      fail-fast: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          path: angr
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v6
      - name: Setup Java for pysoot
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Sync dependencies
        run: uv --directory angr sync -p 3.12
      - name: Run pytest
        run: uv --directory angr run pytest -n auto --splits 5 --group ${{ matrix.runner_id }} tests
  macos:
    name: Test macOS
    runs-on: macos-15
    strategy:
      matrix:
        runner_id: [1, 2, 3]
      fail-fast: false
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          path: angr
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v6
      - name: Sync dependencies
        run: uv --directory angr sync -p 3.12
      - name: Run pytest
        run: uv --directory angr run pytest -n auto --splits 3 --group ${{ matrix.runner_id }} tests

  rust_feature_flags:
    name: Rust Feature Flags
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - ""  # no features
          - "vex-engine"  # VEX engine without Z3
          - "vex-engine,vex-engine-z3"  # VEX engine with Z3
          - "automaton"  # automaton only
      fail-fast: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.10"
      - name: Build with features "${{ matrix.features }}"
        run: cargo check --manifest-path native/angr/Cargo.toml --no-default-features --features "${{ matrix.features }}"
      - name: Test with features "${{ matrix.features }}"
        run: cargo test --manifest-path native/angr/Cargo.toml --no-default-features --features "${{ matrix.features }}"
      - name: Behavioral smoke test with features "${{ matrix.features }}"
        run: cargo test --manifest-path native/angr/Cargo.toml --no-default-features --features "${{ matrix.features }}" --test feature_flag_smoke

  benchmark_regression:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run Rust exploration tests
        run: uv run pytest tests/engines/test_rust_exploration.py -v --tb=short
      - name: Run benchmark regression (fast + medium tier)
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        # --full: covers FAST_SUITE (22) + MEDIUM_SUITE (10) benchmarks
        # so the 7 non-bimodal MEDIUM benches (sym-write, flareon2015_5/10,
        # ekopartyctf2016_rev250, csaw_wyvern, codegate_2017-angrybird,
        # mma_howtouse) actually gate at 15% threshold. Previously these
        # were never auto-checked — angr-rbcf closed this gap. The 3
        # bimodal MEDIUM members (securityfest_fairlight,
        # ekopartyctf2016_sokohashv2, hackcon2016_angry-reverser) are
        # included for drift signal (matches existing FAST behavior with
        # bimodal google2016_unbreakable_1); --retry-failures 2 absorbs
        # most bimodal noise.
        # The peak_memory_mb regression check is on by default (50% over
        # baseline) and runs here as a hard fail — distinct from
        # rss_leak_check, which gates iterative growth on one bench. The PR
        # gate runs the same check in --memory-warn-only mode during the soak.
        # --retry-failures 2: see ci.yml::benchmark_regression for rationale.
        # The retry only re-runs failures and does NOT overwrite the recorded
        # measurement in the history record, so the dashboard's time-series
        # signal still reflects the first measurement of each bench.
        # timeout-minutes bumped 8 → 12 to absorb worst-case MEDIUM tier
        # runtime (~96s baseline + 219s worst-case bimodal retries).
        # --check-counts: hard-enforce the TRACKED_METRICS algorithmic-count
        # gate. The bimodal + MEDIUM-tier benches are exempted in-script
        # (COUNT_EXEMPT in run_regression.py) until they get their own
        # counter-stability soak; the fast tier is soak-validated (angr-bq9v).
        run: |
          uv run python tests/benchmarks/run_regression.py \
            --full \
            --rust-only \
            --retry-failures 2 \
            --check-counts \
            --history-record bench_history_record.json
        timeout-minutes: 12
      - name: Upload benchmark history record
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: bench-history-${{ github.sha }}
          path: bench_history_record.json
          if-no-files-found: warn
          retention-days: 90

  proxy_gates_on:
    name: Write-Through Proxy Gates On
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run Rust exploration tests with proxy gates on
        # angr-rpqk write-through gate-promotion verdict (bd memory
        # write-through-gate-promotion-keep-off-verdict): the four
        # write-through gates below are behaviorally clean (855/855 green
        # with them forced on) but stay default-OFF in production because
        # the FIFTH gate — ANGR_RUST_USE_CALLBACK_REGISTER_PROXY — corrupts
        # PC / state.addr reads (breaks callable find/avoid predicates and
        # stash accessors, times out unmapped_analysis). This nightly job
        # exercises the four clean gates-on proxy paths so they cannot rot
        # while disabled. REGISTER_PROXY is intentionally excluded pending
        # its addr-corruption fix (see follow-up bead); do NOT add it here
        # until that lands.
        env:
          ANGR_RUST_USE_CALLBACK_MEMORY_PROXY: "1"
          ANGR_RUST_USE_CALLBACK_SOLVER_PROXY: "1"
          ANGR_RUST_USE_CALLBACK_CALLSTACK_PROXY: "1"
          ANGR_RUST_USE_SIMPROC_FORK_VIA_RUST: "1"
        run: uv run pytest tests/engines/test_rust_exploration.py --tb=short
        timeout-minutes: 10

  rss_leak_check:
    name: RSS Leak Check (mma_howtouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run leak check (10 main() iters under 4 GB RLIMIT_AS)
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        # Codifies the 9maq bisection method into a nightly gate. The pre-fix
        # mma_howtouse leak was 286 MB -> 1888 MB (~6.6x); current main is
        # within 0.5%. Threshold 1.5x flags any new >=2x regression with margin.
        # See CLAUDE.md "Nightly RSS leak check" for threshold tuning notes.
        run: |
          uv run python tests/benchmarks/run_leak_check.py \
            --iters 10 --threshold 1.5 \
            --json > leak_check_report.json
        timeout-minutes: 10
      - name: Print leak check summary
        if: always()
        run: |
          if [ -f leak_check_report.json ]; then
            cat leak_check_report.json
          fi
      - name: Upload leak check report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: leak-check-report
          path: leak_check_report.json
          if-no-files-found: warn
          retention-days: 90

  property_fuzzer:
    name: Differential Property Fuzzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/binaries
          path: binaries
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          repository: angr/angr-examples
          path: angr-examples
      - uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v6
      - name: Sync dependencies
        run: uv sync -p 3.10
      - name: Build Rust extension
        run: uv run pip install -e . --no-build-isolation --no-deps
      - name: Run property-based differential fuzzer
        env:
          ANGR_EXAMPLES_DIR: ${{ github.workspace }}/angr-examples/examples
        # 50 trials × ~5s/trial ≈ 4–5 min. --strict fails the run on any
        # NEW divergence (i.e. not on the rust_only/bimodal allow-list).
        # Seed is fixed for reproducibility; bump it intentionally to
        # surface new (example, strategy) pairs.
        run: |
          uv run python tests/benchmarks/property_fuzzer.py \
            --trials 50 --seed 1 --strict \
            --report property_fuzzer_report.json
        timeout-minutes: 20
      - name: Upload fuzzer report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: property-fuzzer-report
          path: property_fuzzer_report.json
          if-no-files-found: warn
