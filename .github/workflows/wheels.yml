# Prebuilt manylinux wheel for the Rust engine.
#
# PROTOTYPE — committed UNVERIFIED (bd bead angr-ivwn). See
# docs/advanced-topics/rust_wheel_distribution.rst for the design rationale.
#
# The crux: the Rust cdylib and claripy must load the SAME libz3.so at runtime
# (AST passthrough hands Z3 Ast pointers across the FFI boundary — a pointer is
# only valid in its own Z3_context). Therefore this job MUST NOT let auditwheel
# vendor libz3 into the wheel (that would give the extension a private, second
# Z3 context). Instead it EXCLUDES libz3.so and relativizes RUNPATH to the
# z3-solver wheel's install dir ($ORIGIN/../z3/lib). z3-solver is a runtime dep
# (pinned 4.13.0.0 transitively via claripy==9.2.209 — do not widen; see the
# avoid-pip-install-deps bd memory and the unversioned-SONAME warning in the memo).
#
# Verification (clean-venv install + make test-quick + AST-passthrough smoke)
# can only run in CI with Docker — it cannot be exercised in the dev sandbox.

name: Wheels

on:
  workflow_dispatch:
  # Enable on tags once verified:
  # push:
  #   tags:
  #     - "v*"

jobs:
  build_wheels:
    name: Build manylinux wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          # Linux x86_64 only for the prototype. abi3-py310 (pinned in
          # native/angr/Cargo.toml) collapses the matrix to ONE wheel covering
          # CPython 3.10+ — build on 3.10, the limited-ABI tag (cp310-abi3) is
          # forward-compatible. Compile-verified clean against the full pyo3
          # surface (py-clone + all #[pymethods]); see angr-6f0i.
          CIBW_BUILD: "cp310-manylinux_x86_64"
          # build.rs needs the Rust toolchain + z3 headers + z3-solver's libz3.so.
          # Headers are BUILD-TIME ONLY; they never enter the wheel.
          CIBW_BEFORE_ALL_LINUX: >
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y &&
            (yum install -y zlib-devel || true)
          # Z3_SYS_Z3_HEADER pins the header EPEL's z3-devel installs (/usr/include/z3.h)
          # so z3-sys bindgen never has to guess; build.rs/setup.py probe the same path.
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH" Z3_SYS_Z3_HEADER="/usr/include/z3.h"'
          # z3-solver must be importable so build.rs::find_z3_pkg_from_python resolves
          # libz3.so; z3-devel supplies z3.h for z3-sys bindgen. The manylinux images
          # (AlmaLinux/CentOS) carry z3-devel ONLY in EPEL, which is not enabled by
          # default — enable it first. Do NOT fall back to `pip download z3-solver`:
          # that wheel ships libz3.so but NOT z3.h, so it masks a missing header as
          # success and bindgen then dies with a cryptic NotExist (bd memory
          # wheels-manylinux-z3-header-gap). Fail loud here instead.
          CIBW_BEFORE_BUILD_LINUX: >
            pip install z3-solver==4.13.0.0 patchelf &&
            (yum install -y epel-release || true) &&
            yum install -y z3-devel &&
            (test -f "$Z3_SYS_Z3_HEADER" || { echo "ERROR: $Z3_SYS_Z3_HEADER missing after z3-devel install; enable EPEL or vendor z3.h and re-point Z3_SYS_Z3_HEADER" >&2; exit 1; })
          # DO NOT vendor libz3: exclude it, then point RUNPATH at the
          # z3-solver wheel's lib dir (sibling of angr/ in site-packages).
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >
            auditwheel repair --exclude libz3.so --exclude libz3.so.* -w {dest_dir} {wheel} &&
            for w in {dest_dir}/*.whl; do
              python -m wheel unpack "$w" -d /tmp/wh &&
              patchelf --set-rpath '$ORIGIN/../z3/lib' /tmp/wh/*/angr/rustylib*.so &&
              python -m wheel pack /tmp/wh/* -d {dest_dir} &&
              rm -rf /tmp/wh;
            done
          # Verify the repaired wheel installs clean and resolves the shared libz3.
          # The AST-passthrough smoke test (angr-9eit) is the load-bearing check:
          # it mints a Z3 AST in claripy and reads it back through the Rust solver,
          # proving both halves resolved the SAME site-packages/z3/lib/libz3.so via
          # the wheel's $ORIGIN/../z3/lib RUNPATH. If --exclude libz3.so had failed
          # and the wheel vendored a private libz3 (a second Z3_context), this would
          # crash or return a wrong answer. {project} is the cibuildwheel-provided
          # repo root, so the script ships with the source checkout, not the wheel.
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: >
            python -c "import angr, z3, os; print('z3 lib:', os.path.dirname(z3.__file__))" &&
            python -c "import angr; m=angr.exploration.RustExplorationManager; print('rust engine import OK')" &&
            python {project}/tests/smoke/wheel_ast_passthrough.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux-x86_64
          path: ./wheelhouse/*.whl
